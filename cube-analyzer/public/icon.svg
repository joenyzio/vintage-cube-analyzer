<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#000"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Card stack (3 cards fanned) -->
  <g transform="translate(256, 270)">
    <!-- Back card -->
    <rect x="-70" y="-95" width="100" height="140" rx="8" fill="#1e293b" transform="rotate(-12)" stroke="#334155" stroke-width="2"/>
    <!-- Middle card -->
    <rect x="-70" y="-95" width="100" height="140" rx="8" fill="#334155" transform="rotate(0)" stroke="#475569" stroke-width="2"/>
    <!-- Front card -->
    <rect x="-70" y="-95" width="100" height="140" rx="8" fill="url(#cardGrad)" transform="rotate(12)" stroke="#60a5fa" stroke-width="2"/>
  </g>

  <!-- Sparkles -->
  <g fill="url(#sparkle)">
    <!-- Top right sparkle -->
    <path d="M380 100 L390 130 L420 140 L390 150 L380 180 L370 150 L340 140 L370 130 Z"/>
    <!-- Small sparkle -->
    <path d="M150 120 L155 135 L170 140 L155 145 L150 160 L145 145 L130 140 L145 135 Z" transform="scale(0.7) translate(50, 50)"/>
    <!-- Bottom sparkle -->
    <path d="M420 340 L428 365 L453 373 L428 381 L420 406 L412 381 L387 373 L412 365 Z" transform="scale(0.6)"/>
  </g>

  <!-- "V" letter accent -->
  <text x="256" y="295" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">V</text>
</svg>
